name: Build and publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task install

      - name: Build site
        run: task build

      - name: Verify publish token
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: task verify-token

      - name: Checkout publish repository
        uses: actions/checkout@v4
        with:
          repository: vinaycharlie01/vinaycharlie01.github.io
          token: ${{ secrets.PAGES_TOKEN }}
          path: pages

      - name: Publish
        run: task publish
